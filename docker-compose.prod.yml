services:
  scheduler:
    image: ghcr.io/felipesanchezcla1/distriapp-crons:scheduler-latest
    container_name: scheduler
    env_file: .env
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 2m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"